[package]
name = "atto-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[workspace]

[dev-dependencies]
atto-shared = { path = "../contracts/shared" }
near-sdk = { version = "=5.29.0", features = ["unit-testing"] }
defuse-wallet = { git = "https://github.com/near/intents", rev = "6095765fbdf71bebb7e00dfdaca8c5040adc4fe2", default-features = false, features = ["near-contract", "json"] }
defuse-core = { git = "https://github.com/near/intents", rev = "6095765fbdf71bebb7e00dfdaca8c5040adc4fe2", default-features = false }
near-workspaces = "=0.22.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[[test]]
name = "spike_contract_owner"
path = "spike_contract_owner.rs"

[[test]]
name = "clean_sale_dirty_name"
path = "clean_sale_dirty_name.rs"

[[test]]
name = "deploy_sandbox"
path = "deploy_sandbox.rs"

[[test]]
name = "sale_mid_renewal"
path = "sale_mid_renewal.rs"

[[test]]
name = "deploy_keeper"
path = "deploy_keeper.rs"
